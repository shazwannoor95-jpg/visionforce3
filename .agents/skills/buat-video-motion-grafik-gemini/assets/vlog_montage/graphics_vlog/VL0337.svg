<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Engagement prompt composition 2</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="144" y="97" width="352" height="167" rx="21" fill="#F0F6E6"/></g><g id="accent"><path d="M187,128 H222 V166 H209 L198,178 V166 H187 Z" fill="#C4EC91" stroke="#25374A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="212" width="280" height="31" rx="15" fill="#25374A"/></g><g id="details"></g><g id="text"><text x="247" y="147" fill="#25374A" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">YOUR TURN</text><text x="180" y="192" fill="#25374A" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">WHAT SHOULD WE TRY NEXT?</text><text x="320" y="233" fill="#F0F6E6" font-size="12" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="middle">LEAVE A COMMENT</text></g></svg>