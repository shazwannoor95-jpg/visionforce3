<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Engagement prompt composition 5</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="140" y="81" width="360" height="198" rx="20" fill="#FFF5EA"/></g><g id="accent"><circle cx="195" cy="131" r="28" fill="#FFACAC"/><path d="M186,131 c-9,-14 14,-21 10,-7 c11,-12 24,2 12,12 l-12,12 Z" fill="#41302B" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="213" width="300" height="42" rx="21" fill="#41302B"/></g><g id="details"></g><g id="text"><text x="242" y="134" fill="#41302B" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">PART OF THE CREW</text><text x="173" y="182" fill="#41302B" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">THANKS FOR BEING HERE</text><text x="320" y="240" fill="#FFF5EA" font-size="13" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="middle">LET’S KEEP CREATING</text></g></svg>