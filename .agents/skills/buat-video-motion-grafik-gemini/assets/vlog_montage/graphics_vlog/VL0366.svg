<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Journey ticket composition 1</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="108" y="109" width="424" height="141" rx="14" fill="#F5EEE7"/><line x1="429" y1="121" x2="429" y2="238" stroke="#202A43" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 5"/></g><g id="accent"><circle cx="148" cy="179" r="23" fill="#202A43"/><line x1="136" y1="179" x2="160" y2="179" stroke="#FFB66E" stroke-width="3" stroke-linecap="round"/><path d="M152,171 l8,8 l-8,8" fill="none" stroke="#FFB66E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g id="details"></g><g id="text"><text x="190" y="152" fill="#202A43" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">THE WEEKEND PASS</text><text x="190" y="184" fill="#202A43" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">CITY → COAST</text><text x="190" y="224" fill="#202A43" font-size="10" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">BOARDING / ANY TIME</text><text x="475" y="174" fill="#202A43" font-size="29" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="middle">01</text><text x="475" y="203" fill="#202A43" font-size="9" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">ADMIT ONE</text></g></svg>