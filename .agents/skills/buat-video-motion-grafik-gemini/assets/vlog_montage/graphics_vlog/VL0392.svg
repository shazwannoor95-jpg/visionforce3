<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Story progress composition 2</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="121" y="103" width="398" height="154" rx="20" fill="#F0F6E6"/><line x1="171" y1="183" x2="469" y2="183" stroke="#25374A" stroke-width="4" stroke-linecap="round"/></g><g id="accent"><circle cx="171" cy="183" r="17" fill="#C4EC91" stroke="#25374A" stroke-width="2"/><circle cx="270" cy="183" r="17" fill="#C4EC91" stroke="#25374A" stroke-width="2"/><circle cx="369" cy="183" r="17" fill="#C4EC91" stroke="#25374A" stroke-width="2"/><circle cx="468" cy="183" r="17" fill="#F0F6E6" stroke="#25374A" stroke-width="2"/></g><g id="details"></g><g id="text"><text x="148" y="141" fill="#25374A" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">FROM IDEA TO MEMORY</text><text x="171" y="227" fill="#25374A" font-size="10" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">PLAN</text><text x="270" y="227" fill="#25374A" font-size="10" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">SHOOT</text><text x="369" y="227" fill="#25374A" font-size="10" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">EDIT</text><text x="468" y="227" fill="#25374A" font-size="10" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">SHARE</text></g></svg>