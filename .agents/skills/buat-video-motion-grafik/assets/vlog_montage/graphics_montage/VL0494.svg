<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Little Things"><title>Little Things — original montage graphic</title><g id="main"><rect x="67" y="223" width="510" height="89" rx="12" fill="#fff7eb" stroke="none" stroke-width="1" opacity="1"/></g><g id="accent"><rect x="83" y="301" width="121" height="3" rx="1.5" fill="#ff846e" stroke="none" stroke-width="1" opacity="1"/></g><g id="details"><text x="322.0" y="255" fill="#151e2c" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.1">The little things become the big things.</text><text x="322.0" y="283" fill="#151e2c" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0.1">Keep the feeling. Share the story.</text></g></svg>