<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Caption callout composition 5</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="107" y="113" width="426" height="132" rx="17" fill="#41302B"/><circle cx="145" cy="123" r="31" fill="#FFACAC"/></g><g id="accent"><path d="M133,123 h8 v14 h-12 v-8 h4 Z" fill="#41302B" stroke-linecap="round" stroke-linejoin="round"/><path d="M148,123 h8 v14 h-12 v-8 h4 Z" fill="#41302B" stroke-linecap="round" stroke-linejoin="round"/></g><g id="details"></g><g id="text"><text x="186" y="157" fill="#FFF5EA" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">THE MOMENT THAT</text><text x="186" y="192" fill="#FFACAC" font-size="29" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">MADE MY DAY</text><text x="186" y="223" fill="#FFF5EA" font-size="12" font-family="DejaVu Sans, sans-serif" font-weight="500" text-anchor="start">save this memory</text></g></svg>