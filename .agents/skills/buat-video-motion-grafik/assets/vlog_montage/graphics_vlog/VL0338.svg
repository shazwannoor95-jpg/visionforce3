<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Engagement prompt composition 3</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="182" y="70" width="276" height="229" rx="23" fill="#34304C"/><path d="M241,112 H275 V175 L258,161 L241,175 Z" fill="#C9B4FF" stroke-linecap="round" stroke-linejoin="round"/></g><g id="accent"><circle cx="402" cy="122" r="24" fill="#FAA48F"/><path d="M391,121.92 l6.3,6.3 l14.7,-16.8" fill="none" stroke="#34304C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g id="details"></g><g id="text"><text x="215" y="214" fill="#F5F0FC" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">SAVE THIS SPOT</text><text x="215" y="247" fill="#F5F0FC" font-size="13" font-family="DejaVu Sans, sans-serif" font-weight="500" text-anchor="start">COME BACK LATER</text></g></svg>