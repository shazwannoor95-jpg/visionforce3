<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><title>Vlog checklist composition 3</title><desc>Original editable vector artwork for vlogging. Palette, shape and text layers can be edited independently.</desc><g id="main"><rect x="158" y="78" width="324" height="207" rx="19" fill="#F5F0FC"/></g><g id="accent"><circle cx="204" cy="126" r="18" fill="#34304C"/><circle cx="204" cy="178" r="18" fill="#C9B4FF"/><circle cx="204" cy="230" r="18" fill="#FAA48F"/><path d="M195,126.36 l5.3999999999999995,5.3999999999999995 l12.6,-14.4" fill="none" stroke="#F5F0FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M195,178.36 l5.3999999999999995,5.3999999999999995 l12.6,-14.4" fill="none" stroke="#34304C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="245" y="138" width="204" height="2" rx="1" fill="#34304C"/><rect x="245" y="190" width="204" height="2" rx="1" fill="#34304C"/></g><g id="details"></g><g id="text"><text x="247" y="127" fill="#34304C" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">WAKE / CREATE</text><text x="247" y="179" fill="#34304C" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">WALK / EXPLORE</text><text x="247" y="231" fill="#34304C" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">EDIT / REPEAT</text></g></svg>