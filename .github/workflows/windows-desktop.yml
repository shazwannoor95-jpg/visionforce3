name: Windows Desktop VISIONFORGE 3
on:
  push:
    branches: ['feat/v41-*']
  pull_request:
    paths: ['desktop/**', 'version.json', '.agents/skills/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Sahkan peruntukan versi
        run: python tools/validate_version.py
      - name: Dependency terkunci
        id: dependencies
        working-directory: desktop
        run: npm ci
      - name: Diagnostic 18 skills dan newline Windows
        id: diagnostic
        working-directory: desktop
        run: node scripts/diagnose-skills.cjs
      - name: Ujian unit
        id: unit
        working-directory: desktop
        run: node scripts/run-ci-step.cjs unit
      - name: Typecheck
        id: typecheck
        working-directory: desktop
        run: node scripts/run-ci-step.cjs typecheck
      - name: Build Installer dan Portable UNSIGNED
        id: build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/run-ci-step.cjs build
      - name: Native Electron development smoke
        id: development
        working-directory: desktop
        run: node scripts/run-ci-step.cjs development
      - name: Ujian NSIS ruang, tanpa ruang, portable dan metadata
        id: acceptance
        shell: pwsh
        run: node desktop/scripts/run-ci-step.cjs acceptance
      - name: Remotion MP4 sebenar pada Windows
        id: video
        shell: pwsh
        run: node desktop/scripts/run-ci-step.cjs video
      - name: SHA-256
        id: checksums
        working-directory: desktop
        run: node scripts/run-ci-step.cjs checksums
      - name: Terbit bukti CI ke branch laporan (bukan main)
        if: always()
        env:
          VF_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          VF_DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
          VF_UNIT: ${{ steps.unit.outcome }}
          VF_TYPECHECK: ${{ steps.typecheck.outcome }}
          VF_BUILD: ${{ steps.build.outcome }}
          VF_DEVELOPMENT: ${{ steps.development.outcome }}
          VF_ACCEPTANCE: ${{ steps.acceptance.outcome }}
          VF_VIDEO: ${{ steps.video.outcome }}
          VF_CHECKSUMS: ${{ steps.checksums.outcome }}
        run: node desktop/scripts/publish-ci-evidence.cjs
      - name: Simpan bukti walaupun ujian gagal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VISIONFORGE3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/release/**/*Setup-x64.exe
            desktop/release/**/*Portable-x64.exe
            desktop/release/**/SHA256SUMS.txt
            artifacts/desktop/**
            desktop/release/**/windows-tests.json
            desktop/release/**/build.json
            artifacts/desktop/ci-summary.json
          if-no-files-found: warn
          retention-days: 30
